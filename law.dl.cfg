[core]

# inherit from the main analysis configuration file
inherit: $HBW_BASE/law.cfg

[analysis]

# override defaults for the DL analysis
default_analysis: hbw.analysis.hbw_dl.hbw_dl
default_config: c24v15
default_dataset: hh_ggf_hbb_hvv2l2nu_kl1_kt1_powheg

# default_ml_models: multiclassv1,ggfv1,vbfv1

dl1_version:
event_weights_version:
dl_ml_inputs_version:

[outputs]

private_dust_location_lara: /data/dust/user/markusla/analysis/dilepton/hh2bbww/data/cf_store
shared_dust_location_lara: /data/dust/user/markusla/public/hh2bbww/data/common_store/

private_dust_location_bianca: /data/dust/user/weidnerb/HHH/hh2bbww/data/cf_store/
shared_dust_location_bianca: /data/dust/user/weidnerb/public/hh2bbww/data/common_store/

private_dust_location_balduin: /data/dust/user/letzerba/hh2bbww/data/cf_store
shared_dust_location_balduin: /data/dust/user/letzerba/public/hh2bbww/data/common_store/

task_cf.GetDatasetLFNs__dataset_hhh_*: wlcg, wlcg_fs_desy_bletzer, hbw_parts
