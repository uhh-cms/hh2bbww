task_cf.GetDatasetLFNs__dataset_tth_hbb_*: local, %(shared_dust_location_lara)s, hbw_parts
task_cf.CalibrateEvents__dataset_tth_hbb_*: wlcg, wlcg_fs_desy_bletzer, hbw_parts
