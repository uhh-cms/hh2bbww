[core]

# inherit from the main analysis configuration file
inherit: $HBW_BASE/law.cfg

[analysis]

# override defaults for the DL analysis
default_analysis: hbw.analysis.hbw_dl.hbw_dl
default_config: c24v15
default_dataset: hh_ggf_hbb_hvv2l2nu_kl1_kt1_powheg

# default_ml_models: multiclassv1,ggfv1,vbfv1

dl1_version: 0
event_weights_version: 
dl_ml_inputs_version: 

[outputs]

shared_hbw_2024_location: /data/dust/user/markusla/analysis/dilepton/hh2bbww/data/cf_store
shared_hbw_2023_location: /data/dust/user/letzerba/analysis/dilepton/hh2bbww/data/cf_store
shared_common_2024_location: /data/dust/user/markusla/public/hh2bbww/data/common_store/
shared_common_2023_location: /data/dust/user/letzerba/public/hh2bbww/data/common_store/

cfg_c24v15__task_cf.SelectEvents: local, %(shared_common_2024_location)s, hbw_parts
cfg_c24v15__task_cf.ReduceEvents: local, %(shared_common_2024_location)s, hbw_parts
cfg_c24v15__task_cf.GetDatasetLFNs: local, %(shared_common_2024_location)s, hbw_parts
cfg_c24v15__task_cf.CalibrateEvents: local, %(shared_common_2024_location)s, hbw_parts

cfg_c23prev14__task_cf.SelectEvents: local, %(shared_common_2023_location)s, hbw_parts
cfg_c23prev14__task_cf.ReduceEvents: local, %(shared_common_2023_location)s, hbw_parts
cfg_c23prev14__task_cf.GetDatasetLFNs: local, %(shared_common_2023_location)s, hbw_parts
cfg_c23prev14__task_cf.CalibrateEvents: local, %(shared_common_2023_location)s, hbw_parts

production_modules: hbw.production.{weights,features,ml_inputs,categories,gen_vbf_candidate,neutrino,synchronization}, hbw.ml.stats
calibration_modules: columnflow.calibration.jets, hbw.calibration.default
selection_modules: hbw.selection.{dl_remastered}

# cf.*: local, %(shared_hbw_2024_location)s, hbw_parts
# hbw.*: local, %(shared_hbw_2024_location)s, hbw_parts
